<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8eef8"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>

  <!-- 文档纸张 -->
  <rect x="140" y="104" width="232" height="288" rx="26" fill="url(#paper)"/>
  <!-- 表格网格 -->
  <line x1="140" y1="176" x2="372" y2="176" stroke="#93b4ea" stroke-width="10"/>
  <line x1="140" y1="244" x2="372" y2="244" stroke="#c3d6f5" stroke-width="10"/>
  <line x1="140" y1="312" x2="372" y2="312" stroke="#c3d6f5" stroke-width="10"/>
  <line x1="222" y1="104" x2="222" y2="392" stroke="#93b4ea" stroke-width="10"/>
  <line x1="292" y1="104" x2="292" y2="392" stroke="#c3d6f5" stroke-width="10"/>

  <!-- 成功对勾徽章 -->
  <circle cx="366" cy="366" r="78" fill="#16a34a" stroke="#ffffff" stroke-width="16"/>
  <path d="M326 366 l28 30 l52 -60" fill="none" stroke="#ffffff" stroke-width="24"
        stroke-linecap="round" stroke-linejoin="round"/>
